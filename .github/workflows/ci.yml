name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# FRONTEND JOB — Node.js 20, Vite build, Vitest, ESLint
# ============================================================
jobs:
  frontend:
    name: "Frontend (Node 20)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_API_URL: http://localhost:8000
          VITE_APP_NAME: CipherShield

      - name: Run unit tests (Vitest)
        run: npm run test -- --reporter=verbose --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ============================================================
  # BACKEND JOB — Python 3.11, pytest, ruff
  # ============================================================
  backend:
    name: "Backend (Python 3.11)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -v --tb=short --asyncio-mode=auto
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_JWT_SECRET: placeholder-jwt-secret-32-chars-long!
          SECRET_KEY: test-secret-key-for-ci-only-32ch!
          ALLOWED_ORIGINS: http://localhost:5173
          HIBP_API_KEY: placeholder
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASS: placeholder
          EMAIL_FROM: noreply@ciphershield.app

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest-results
          path: backend/.pytest_cache/
          retention-days: 7
